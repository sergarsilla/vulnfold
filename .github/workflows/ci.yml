# Checks that must pass before a change lands. Deployment lives elsewhere: this
# workflow proves the tree is sound, it does not ship anything.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml and the version the image ships.
        # A change that works on one and not the other is a bug either way.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run the test suite
        run: uv run --group dev --python ${{ matrix.python-version }} pytest -q

      - name: Type-check
        run: uv run --group dev --python ${{ matrix.python-version }} mypy

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The image build runs the suite in a stage the runtime depends on, so
      # this also proves that gate still fires. Nothing is pushed.
      - name: Build the container image
        run: docker build --target runtime -t vulnfold:ci .

      - name: Verify the entry point resolves
        run: docker run --rm --read-only --cap-drop=ALL vulnfold:ci --help
