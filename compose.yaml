# One-shot scan. `docker compose run --rm scan` runs it; there is no long-lived
# service here, which is why no `restart` policy is set.
#
# Credentials come from the environment, never from this file. Put
# VULNFOLD_PASSWORD in a .env beside this file (already gitignored) or export it
# in the shell that invokes compose.

services:
  scan:
    build: .
    image: vulnfold:0.1.0
    environment:
      # Passed through from the host; compose fails loudly if it is unset.
      VULNFOLD_PASSWORD: ${VULNFOLD_PASSWORD:?set VULNFOLD_PASSWORD}
    # The tool only reads. Denying writes to the container filesystem makes that
    # property enforceable from outside the code, not just asserted by it.
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # Evidence files land on the host. Drop this mount if --evidence is unused.
    volumes:
      - ./evidence:/home/vulnfold/evidence
    command:
      - scan
      - --url=${VULNFOLD_URL:?set VULNFOLD_URL}
      - --user=${VULNFOLD_USER:-readonly}
      - --format=markdown
