# One-shot scan. `docker compose run --rm scan` runs it; nothing here is a
# long-lived service, which is why no `restart` policy is set.
#
# Credentials never live in this file. The deployment installs a .env beside it
# (gitignored, delivered by CI as a managed file); for a local run, export the
# variables in your shell instead.
#
# Values in .env are LITERAL. Compose does not undo shell escaping, so a
# password written the way `printf %q` would write it — say `abc\*def` — reaches
# the container with the backslashes still in it and authentication fails with
# HTTP 401. Copy secrets raw, with no quoting and no backslashes. A literal `$`
# is the one exception and must be doubled to `$$`, because Compose interpolates
# it.
#
# .env keys:
#   VULNFOLD_URL           indexer base URL including port
#   VULNFOLD_USER          account with read access to the state index
#   VULNFOLD_PASSWORD      that account's password
#   VULNFOLD_NETWORK_MODE  "host" when the indexer listens on the deploy host's
#                          loopback; leave unset for a reachable remote indexer
#   VULNFOLD_EXTRA_ARGS    extra CLI flags, e.g. --insecure for a self-signed
#                          indexer certificate

services:
  scan:
    build: .
    image: vulnfold:0.1.0
    # required:false so `docker compose build` works on a checkout with no .env,
    # which is what the deployment hook does before any secret is present.
    env_file:
      - path: .env
        required: false
    # A Wazuh indexer installed natively usually binds 127.0.0.1 only, and a
    # bridged container cannot reach it. Host mode is the fix that does not
    # require rebinding the indexer to a wider interface.
    network_mode: ${VULNFOLD_NETWORK_MODE:-bridge}
    # The tool only reads. Denying writes to the container filesystem makes that
    # property enforceable from outside the code, not merely asserted by it.
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # Evidence files land on the host. The directory must be writable by uid
    # 10001; the deployment hook creates it with that owner.
    volumes:
      - ./evidence:/home/vulnfold/evidence
    # String form so an unset VULNFOLD_EXTRA_ARGS collapses to nothing rather
    # than becoming an empty argument. vulnfold reports a missing or unreachable
    # indexer far better than compose would, so no variable is made mandatory.
    command: >-
      scan
      --url=${VULNFOLD_URL:-}
      --user=${VULNFOLD_USER:-}
      --format=markdown
      ${VULNFOLD_EXTRA_ARGS:-}
