# Field mapping for Wazuh 4.x vulnerability state indices.
#
# Every schema dependency of vulnfold lives in this directory. Porting to
# another Wazuh release means adding a sibling file, never editing code.
version: "4.x"
index_pattern: "wazuh-states-vulnerabilities-*"
fields:
  package_name: "package.name"
  package_version: "package.version"
  cve_id: "vulnerability.id"
  severity: "vulnerability.severity"
  agent_id: "agent.id"
  agent_name: "agent.name"
  scanner_condition: "vulnerability.scanner.condition"
severity_order: ["Critical", "High", "Medium", "Low"]
severity_unknown: ["-", "None", ""]

# How the condition string classifies a finding. A future Wazuh release may
# reword these markers, so they are vocabulary, not code.
fixability:
  # Exact value (case-insensitive) meaning "affected, no fixed version exists".
  no_fix_values: ["Package default status"]
  # Prefix (case-insensitive) introducing a target version; the remainder of
  # the string after this prefix is the version to upgrade to.
  fixed_version_prefix: "Package less than "
